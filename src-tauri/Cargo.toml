[package]
name = "quantdesk"
version = "0.3.5"
description = "QuantDesk agent-first quantitative investment desktop"
authors = ["QuantDesk"]
edition = "2021"

[lib]
name = "quantdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI", "Win32_UI_WindowsAndMessaging"] }
